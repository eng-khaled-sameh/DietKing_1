name: my_desktop_app
description: "Diet King POS — Point of Sale & ERP System"
publish_to: 'none'

version: 4.2.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State management — feature-scoped Cubits
  flutter_bloc: ^9.1.1
  # Value equality for Cubit states
  equatable: ^2.0.7
  # IBM Plex Sans via Google Fonts
  google_fonts: ^6.2.1
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
